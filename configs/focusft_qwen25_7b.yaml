# Reference hyperparameters for the main FocuSFT configuration in the paper.
# The training script uses Hugging Face HfArgumentParser; pass these values as
# command-line flags or adapt this file for your launcher.

model_name_or_path: Qwen/Qwen2.5-7B
train_data: /path/to/open-agentsft-3k.parquet
output_dir: ./checkpoints/focusft-qwen25-7b

max_length: 4096
num_train_epochs: 5
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 1.0e-5
lr_scheduler_type: cosine
warmup_ratio: 0.1
weight_decay: 0.01
max_grad_norm: 1.0
bf16: true
gradient_checkpointing: true
attn_implementation: sdpa
seed: 1234

num_inner_steps: 2
inner_lr: 1.0
inner_grad_clip: 1.0
inner_rank: 32
inner_alpha: 64.0
inner_dropout: 0.0
inner_layer_fraction: 0.35
inner_target_modules: gate_proj,up_proj,down_proj
inner_gradient_checkpointing: true
sync_inner: false
